name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend + frontend tests with coverage
        run: |
          pytest tests/ -v \
            --cov=dashboard \
            --cov-report=term-missing \
            --cov-report=xml \
            -p no:warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Check CSS file exists
        run: |
          test -f dashboard/assets/css/space_theme.css && echo "CSS OK" || exit 1

      - name: Check Streamlit config exists
        run: |
          test -f .streamlit/config.toml && echo "Config OK" || exit 1

      - name: Validate all page files are importable Python
        run: |
          python -c "
          import ast, pathlib
          pages = list(pathlib.Path('dashboard/pages').glob('*.py'))
          pages.append(pathlib.Path('dashboard/app.py'))
          for p in pages:
              ast.parse(p.read_text())
              print(f'  OK: {p.name}')
          print(f'Validated {len(pages)} page files')
          "

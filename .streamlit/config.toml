[theme]
base = "dark"
backgroundColor      = "#080B14"
secondaryBackgroundColor = "#0D1220"
textColor            = "#E8EDF5"
primaryColor         = "#00D4FF"
font                 = "monospace"

[server]
headless          = true
enableCORS        = false
enableXsrfProtection = true
maxUploadSize     = 50

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
